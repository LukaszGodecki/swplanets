@if (!planetsStore.selectedPlanet()) {
  <div>Select a planet</div>
} @else {
  <div class="planet-info">
    <div>Name: {{ planetsStore.selectedPlanet()?.name }}</div>
    <div>Climate: {{ planetsStore.selectedPlanet()?.climate }}</div>
    <div>Terrain: {{ planetsStore.selectedPlanet()?.terrain }}</div>
    <div>Population: {{ planetsStore.selectedPlanet()?.population }}</div>
    <button (click)="addSelectedPlanetToMyJourney()">+ Add to My journey</button>
  </div>
  <br />
  <label>Visit with: </label>
  <select [(ngModel)]="selectedPerson">
    @for (person of planetsApiService.people(); track person) {
      <option [value]="person">{{ person }}</option>
    }
  </select>
}
